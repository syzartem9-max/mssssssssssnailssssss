<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MS_NAILS — Админ</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .lightbox {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92);
      z-index: 1000; align-items: center; justify-content: center; padding: 20px;
    }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 16px; object-fit: contain; }
    .lightbox-close {
      position: absolute; top: 16px; right: 20px; background: rgba(255,255,255,0.15);
      border: none; color: #fff; font-size: 28px; width: 44px; height: 44px;
      border-radius: 50%; cursor: pointer;
    }
    .day-group { margin-bottom: 28px; }
    .day-title {
      font-size: 15px; font-weight: 800; color: #e9d5ff; margin-bottom: 12px;
      padding-bottom: 6px; border-bottom: 1px solid rgba(192,132,252,0.25);
    }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(120px);
      background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff;
      padding: 14px 22px; border-radius: 14px; font-weight: 700; font-size: 14px;
      z-index: 2000; box-shadow: 0 8px 30px rgba(22,163,74,0.4);
      transition: transform 0.35s ease; max-width: 90%; text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab {
      flex: 1; padding: 12px; border-radius: 12px; border: 1px solid rgba(192,132,252,0.25);
      background: rgba(255,255,255,0.05); color: #c4b5fd; font-weight: 700;
      cursor: pointer; text-align: center;
    }
    .tab.active { background: rgba(168,85,247,0.25); color: #fff; border-color: #c084fc; }
    .client-card {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(192,132,252,0.2);
      border-radius: 14px; padding: 14px; margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div id="app" style="padding-bottom: 40px;">
    <div id="admin-login-box" class="card" style="margin-top: 40px;">
      <h2 class="chrome-text" style="text-align:center;margin-bottom:20px;">Кабинет мастера</h2>
      <input type="text" id="admin-login" class="input" placeholder="Логин" value="admin" />
      <input type="password" id="admin-pass" class="input" placeholder="Пароль" />
      <button class="btn-main" id="btn-admin-login">Войти</button>
    </div>

    <div id="admin-content" class="hidden">
      <div class="header-bar">
        <div class="chrome-text title">Админ</div>
        <button class="btn-sec small" onclick="logoutAdmin()">Выйти</button>
      </div>

      <div class="tabs">
        <div class="tab active" data-tab="slots" onclick="switchTab('slots')">Записи</div>
        <div class="tab" data-tab="clients" onclick="switchTab('clients')">Клиентки</div>
        <div class="tab" data-tab="price" onclick="switchTab('price')">Прайс</div>
        <div class="tab" data-tab="settings" onclick="switchTab('settings')">Настройки</div>
      </div>

      <div id="tab-slots">
        <div class="card">
          <h3 style="margin-bottom:10px;font-weight:700">Добавить окошко</h3>
          <input type="date" id="new-date" class="input" />
          <input type="time" id="new-time" class="input" value="12:00" />
          <button class="btn-main" id="btn-add-slot">+ Добавить</button>
        </div>
        <div id="admin-slots"></div>
      </div>

      <div id="tab-clients" class="hidden">
        <div class="card">
          <h3 style="margin-bottom:10px;font-weight:700">База клиенток</h3>
          <input type="text" id="client-search" class="input" placeholder="Поиск по номеру или имени..." />
          <button class="btn-main" id="btn-search-clients">Найти</button>
        </div>
        <div id="clients-list"></div>
      </div>

      <div id="tab-price" class="hidden">
        <div class="card">
          <h3 style="margin-bottom:10px;font-weight:700">Редактирование прайса</h3>
          <p class="hint">Меняй названия и цены. Сохрани — клиенты увидят новые значения при записи (после обновления страницы).</p>
          <div id="price-editor"></div>
          <button class="btn-main" id="btn-save-price" style="margin-top:12px">Сохранить прайс</button>
        </div>
      </div>

      <div id="tab-settings" class="hidden">
        <div class="card">
          <h3 style="margin-bottom:10px;font-weight:700">Уведомления</h3>
          <p class="hint">Telegram ID для новых заявок (@userinfobot)</p>
          <input type="text" id="notify-id" class="input" placeholder="123456789" />
          <button class="btn-main" id="btn-save-notify">Сохранить</button>
        </div>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <img id="lightbox-img" src="" alt="" />
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const API = window.location.origin;
    let adminToken = localStorage.getItem('adminToken');

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3200);
    }

    function switchTab(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
      ['slots','clients','price','settings'].forEach(n => {
        document.getElementById('tab-' + n).classList.toggle('hidden', n !== name);
      });
      if (name === 'clients') loadClients();
      if (name === 'slots') loadAdmin();
      if (name === 'price') loadPriceEditor();
    }

    if (adminToken) {
      document.getElementById('admin-login-box').classList.add('hidden');
      document.getElementById('admin-content').classList.remove('hidden');
      loadAdmin();
      loadSettings();
    }

    document.getElementById('btn-admin-login').onclick = async () => {
      const login = document.getElementById('admin-login').value;
      const password = document.getElementById('admin-pass').value;
      try {
        const res = await fetch(API + '/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login, password })
        });
        const data = await res.json();
        if (!res.ok) return alert(data.error);
        adminToken = data.token;
        localStorage.setItem('adminToken', adminToken);
        document.getElementById('admin-login-box').classList.add('hidden');
        document.getElementById('admin-content').classList.remove('hidden');
        loadAdmin();
        loadSettings();
      } catch (e) { alert('Ошибка'); }
    };

    function logoutAdmin() {
      adminToken = null;
      localStorage.removeItem('adminToken');
      location.reload();
    }

    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('active');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    async function loadSettings() {
      try {
        const res = await fetch(API + '/api/admin/settings', { headers: { 'X-Admin-Token': adminToken } });
        const s = await res.json();
        document.getElementById('notify-id').value = s.admin_tg_id || '';
      } catch {}
    }

    async function loadAdmin() {
      const box = document.getElementById('admin-slots');
      try {
        const res = await fetch(API + '/api/admin/slots', { headers: { 'X-Admin-Token': adminToken } });
        let slots = await res.json();
        const now = Date.now();
        slots = slots.filter(s => {
          if (s.status !== 'cancelled') return true;
          const updated = new Date(s.updated_at || s.created_at).getTime();
          return (now - updated) < 5 * 60 * 1000;
        });

        const groups = {};
        slots.forEach(s => {
          if (!groups[s.date]) groups[s.date] = [];
          groups[s.date].push(s);
        });
        const dates = Object.keys(groups).sort();

        if (!dates.length) {
          box.innerHTML = '<div class="empty">Нет слотов</div>';
          return;
        }

        box.innerHTML = dates.map(date => {
          const d = new Date(date + 'T00:00:00');
          const days = ['вс','пн','вт','ср','чт','пт','сб'];
          const title = `${days[d.getDay()]} ${date.slice(8)}.${date.slice(5,7)}.${date.slice(0,4)}`;
          const items = groups[date].sort((a,b) => a.time.localeCompare(b.time)).map(s => {
            const photosHtml = (s.photos && s.photos.length)
              ? `<div class="admin-photos">${s.photos.map(p => `<img src="${p}" onclick="event.stopPropagation();openLightbox('${p}')" />`).join('')}</div>`
              : '';
            const priceStr = s.price ? `<div style="margin-top:6px;font-weight:800;color:#e9d5ff">💰 ${Number(s.price).toLocaleString('ru')} ₽</div>` : '';
            return `
              <div class="admin-slot">
                <div>
                  <strong>${s.time}</strong>
                  <span class="status status-${s.status}">${s.status}</span>
                </div>
                ${s.client_name ? `
                  <div style="font-size:13px;margin-top:8px;color:#c4b5fd;line-height:1.5">
                    👤 ${s.client_name}<br>
                    📞 ${s.client_phone || '—'}<br>
                    ${s.client_username ? '@' + s.client_username.replace('@','') + '<br>' : ''}
                    ${s.service ? '💅 ' + s.service + '<br>' : ''}
                    ${s.comment ? '💬 ' + s.comment : ''}
                  </div>
                  ${priceStr}
                  ${photosHtml}
                  <div style="margin-top:10px">
                    <label style="font-size:12px;color:#a78bfa">Ваш комментарий (скрыт)</label>
                    <input class="input" style="margin-bottom:6px" id="ac-${s.id}" value="${(s.admin_comment || '').replace(/"/g, '&quot;')}" placeholder="Заметка для себя..." />
                    <label style="font-size:12px;color:#a78bfa">Цена (₽)</label>
                    <input class="input" type="number" id="pr-${s.id}" value="${s.price || ''}" placeholder="Итого" />
                    <button class="btn-sec small" style="width:100%;margin-top:6px" onclick="saveSlotMeta('${s.id}')">Сохранить комментарий и цену</button>
                  </div>
                ` : ''}
                <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
                  ${s.status === 'pending' ? `
                    <button class="btn-sec small" onclick="setStatus('${s.id}','booked')">Подтвердить</button>
                    <button class="btn-sec small" onclick="setStatus('${s.id}','cancelled')">Отклонить</button>
                  ` : ''}
                  ${s.status === 'booked' ? `
                    <button class="btn-sec small" onclick="setStatus('${s.id}','cancelled')">Отменить</button>
                  ` : ''}
                  ${s.status === 'cancelled' ? `
                    <button class="btn-sec small" onclick="setStatus('${s.id}','booked')">Вернуть</button>
                  ` : ''}
                  ${s.status === 'available' ? `
                    <button class="btn-sec small" onclick="delSlot('${s.id}')">Удалить</button>
                  ` : ''}
                  ${s.status !== 'available' ? `
                    <button class="btn-sec small" onclick="editSlot('${s.id}')">Редактировать</button>
                  ` : ''}
                </div>
              </div>
            `;
          }).join('');
          return `<div class="day-group"><div class="day-title">${title}</div>${items}</div>`;
        }).join('');
      } catch {
        box.innerHTML = 'Ошибка загрузки';
      }
    }

    async function saveSlotMeta(id) {
      const admin_comment = document.getElementById('ac-' + id)?.value || '';
      const price = document.getElementById('pr-' + id)?.value || 0;
      await fetch(API + '/api/admin/slots/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
        body: JSON.stringify({ admin_comment, price: Number(price) || 0 })
      });
      showToast('Сохранено');
      loadAdmin();
    }

    async function loadClients(q = '') {
      const box = document.getElementById('clients-list');
      try {
        const res = await fetch(API + '/api/admin/clients?q=' + encodeURIComponent(q), {
          headers: { 'X-Admin-Token': adminToken }
        });
        const list = await res.json();
        if (!list.length) {
          box.innerHTML = '<div class="empty">Клиенток пока нет</div>';
          return;
        }
        box.innerHTML = list.map(c => `
          <div class="client-card">
            <div style="font-weight:800">${c.name || '—'}</div>
            <div style="color:#c4b5fd;margin-top:4px">📞 ${c.phone}</div>
            ${c.username ? `<div style="color:#a78bfa">@${c.username.replace('@','')}</div>` : ''}
            <div style="margin-top:6px;font-size:13px">Визитов: <strong>${c.visits || 0}</strong></div>
            <textarea class="input" style="margin-top:8px" rows="2" id="cn-${c.id}" placeholder="Заметки...">${c.notes || ''}</textarea>
            <button class="btn-sec small" style="width:100%;margin-top:6px" onclick="saveClient('${c.id}')">Сохранить</button>
          </div>
        `).join('');
      } catch {
        box.innerHTML = 'Ошибка';
      }
    }

    document.getElementById('btn-search-clients').onclick = () => {
      loadClients(document.getElementById('client-search').value.trim());
    };
    document.getElementById('client-search').addEventListener('keydown', e => {
      if (e.key === 'Enter') loadClients(e.target.value.trim());
    });

    async function saveClient(id) {
      const notes = document.getElementById('cn-' + id)?.value || '';
      await fetch(API + '/api/admin/clients/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
        body: JSON.stringify({ notes })
      });
      showToast('Клиентка сохранена');
    }

    setInterval(() => { if (adminToken) loadAdmin(); }, 30000);

    document.getElementById('btn-save-notify').onclick = async () => {
      const id = document.getElementById('notify-id').value.trim();
      await fetch(API + '/api/admin/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
        body: JSON.stringify({ admin_tg_id: id })
      });
      showToast('Сохранено');
    };

    document.getElementById('btn-add-slot').onclick = async () => {
      const date = document.getElementById('new-date').value;
      const time = document.getElementById('new-time').value;
      if (!date || !time) return alert('Укажи дату и время');
      const res = await fetch(API + '/api/admin/slots', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
        body: JSON.stringify({ date, time })
      });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        return alert(d.error || 'Ошибка');
      }
      const [y, m, d] = date.split('-');
      showToast(`Успешно создана запись ${d}.${m}.${y} в ${time}`);
      loadAdmin();
    };

    async function setStatus(id, status) {
      await fetch(API + '/api/admin/slots/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
        body: JSON.stringify({ status })
      });
      loadAdmin();
    }

    async function delSlot(id) {
      if (!confirm('Удалить слот?')) return;
      await fetch(API + '/api/admin/slots/' + id, {
        method: 'DELETE',
        headers: { 'X-Admin-Token': adminToken }
      });
      loadAdmin();
    }

    async function editSlot(id) {
      const newTime = prompt('Новое время (ЧЧ:ММ):');
      if (!newTime) return;
      const newDate = prompt('Новая дата (ГГГГ-ММ-ДД):');
      if (!newDate) return;
      await fetch(API + '/api/admin/slots/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
        body: JSON.stringify({ date: newDate, time: newTime })
      });
      loadAdmin();
    }
  </script>
</body>
</html>
